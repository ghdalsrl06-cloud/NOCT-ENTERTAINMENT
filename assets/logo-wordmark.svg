<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-label="NOCT ENTERTAINMENT">
  <!-- 가로 조합형 로고 : 심벌 + 워드마크(NO + 검은 달 C + T) + ENTERTAINMENT. 어두운 배경 위에서 사용 -->
  <defs>
    <linearGradient id="w-moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9b8ff"/>
      <stop offset="1" stop-color="#6f8cff"/>
    </linearGradient>
  </defs>
  <g transform="translate(16 16)">
    <path d="M32 6 A26 26 0 1 0 32 58 A34 34 0 0 1 32 6 Z" fill="url(#w-moon)"/>
    <rect x="33" y="27" width="5" height="10" rx="2.5" fill="#6f8cff"/>
    <rect x="41" y="22" width="5" height="20" rx="2.5" fill="#6f8cff"/>
    <rect x="49" y="16" width="5" height="32" rx="2.5" fill="#6f8cff"/>
  </g>
  <g font-family="'Space Grotesk', 'Inter', Arial, sans-serif" font-weight="700" font-size="46" fill="#ecebe6">
    <text x="98" y="56" letter-spacing="10">NO</text>
    <text x="230" y="56">T</text>
  </g>
  <!-- C 자리의 검은 달 -->
  <path transform="translate(178 17) scale(0.62)" d="M48 11.5 A26 26 0 1 0 48 52.5 A22 22 0 0 1 48 11.5 Z" fill="#0d0f18" stroke="#a9b8ff" stroke-width="5" stroke-linejoin="round"/>
  <text x="100" y="78" font-family="'Space Grotesk', 'Inter', Arial, sans-serif" font-weight="500" font-size="11" letter-spacing="6.2" fill="#8f93a3">ENTERTAINMENT</text>
</svg>
